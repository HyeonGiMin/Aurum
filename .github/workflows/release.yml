# 릴리즈 — 태그(vX.Y.Z)를 밀면 Windows·macOS 배포본을 Velopack 으로 묶어 GitHub Release 에 올린다.
# 앱은 시작할 때 이 Release 를 보고 새 버전 팝업을 띄운다 (src/PrismOne.Studio/AppUpdater.cs).
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# 버전은 태그에서 나온다 (v 접두 제거). 같은 태그로 두 플랫폼이 한 Release 에 합쳐지므로
# (--merge) macOS 잡은 Windows 잡이 Release 를 만든 뒤에 돈다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Release 생성·자산 업로드

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Velopack 은 파일 단위로 갱신하므로 단일 파일(PublishSingleFile)로 묶지 않는다.
      - name: Publish (win-x64)
        run: >
          dotnet publish src/PrismOne.Studio -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.ver.outputs.version }} -p:DebugType=none
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk

      # 이전 릴리즈를 받아 두면 델타 패키지가 생겨 업데이트 다운로드가 작아진다. 첫 릴리즈면 없다.
      - name: Download previous releases (for delta)
        continue-on-error: true
        run: >
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} -c win -o releases

      - name: Pack
        run: >
          vpk pack -u Aurum -v ${{ steps.ver.outputs.version }} -p publish -e Aurum.exe
          --packTitle Aurum --packAuthors "HyeonGi Min"
          --icon src/PrismOne.Studio/Assets/icon.ico
          -c win -o releases

      - name: Upload to GitHub Release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish --merge
          --tag ${{ github.ref_name }} --releaseName "Aurum ${{ steps.ver.outputs.version }}"
          -c win -o releases

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (osx-arm64)
        run: >
          dotnet publish src/PrismOne.Studio -c Release -r osx-arm64 --self-contained
          -p:Version=${{ steps.ver.outputs.version }} -p:DebugType=none
          -o publish

      # vpk 의 macOS 아이콘은 .icns 여야 한다 — packaging/macos/make-app.sh 와 같은 방식으로 만든다.
      - name: Make icon.icns
        run: |
          set -eu
          SRC=src/PrismOne.Studio/Assets/icon_1024.png
          rm -rf icon.iconset && mkdir icon.iconset
          for SZ in 16 32 64 128 256 512; do
            sips -z $SZ $SZ "$SRC" --out "icon.iconset/icon_${SZ}x${SZ}.png" >/dev/null
            SZ2=$((SZ * 2))
            sips -z $SZ2 $SZ2 "$SRC" --out "icon.iconset/icon_${SZ}x${SZ}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Download previous releases (for delta)
        continue-on-error: true
        run: >
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} -c osx-arm64 -o releases

      - name: Pack
        run: >
          vpk pack -u Aurum -v ${{ steps.ver.outputs.version }} -p publish -e Aurum
          --packTitle Aurum --packAuthors "HyeonGi Min"
          --icon icon.icns
          -c osx-arm64 -o releases

      - name: Upload to GitHub Release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish --merge
          --tag ${{ github.ref_name }} --releaseName "Aurum ${{ steps.ver.outputs.version }}"
          -c osx-arm64 -o releases
